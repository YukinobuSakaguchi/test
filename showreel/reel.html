<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E/E Engineering Showreel</title>
<style>
@font-face{font-family:'Unb';src:url(fonts/Unbounded-800.ttf);font-weight:800}
@font-face{font-family:'JBM';src:url(fonts/JBMono-500.ttf);font-weight:500}
@font-face{font-family:'JBM';src:url(fonts/JBMono-700.ttf);font-weight:700}
@font-face{font-family:'NJP';src:url(fonts/NotoSansJP-900.ttf);font-weight:900}
@font-face{font-family:'IT';src:url(fonts/InterTight-300.ttf);font-weight:300}
@font-face{font-family:'IT';src:url(fonts/InterTight-800.ttf);font-weight:800}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#8ab;font:12px monospace}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">click: play / pause (with sound)</div>
<script>
/* ============================================================
   AUTOMOTIVE E/E ENGINEERING — 15s SHOWREEL
   Deterministic renderer: renderFrame(t) draws time t (sec).
   120 BPM → 1 beat = 0.5 s. Cuts: 2 / 4 / 6 / 9 / 11 / 13 s
   ============================================================ */
const W=1920,H=1080,CX=W/2,CY=H/2,DUR=15,FPS=60;
const COL={bg:'#03060c',cy:'#19e3ff',or:'#ff6b1c',wh:'#eef7ff',rd:'#ff2d55',nv:'#0a1424'};
const cyA=a=>`rgba(25,227,255,${a})`, orA=a=>`rgba(255,107,28,${a})`, whA=a=>`rgba(238,247,255,${a})`;
const out=document.getElementById('c'), octx=out.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const S=mk(W,H), ctx=S.getContext('2d');              // scene
const B1=mk(W/4,H/4), b1=B1.getContext('2d');          // bloom (tight)
const B2=mk(W/8,H/8), b2=B2.getContext('2d');          // bloom (wide)
const R=mk(W,H), rx=R.getContext('2d');                // red channel / scratch
const G=mk(W,H), gx=G.getContext('2d');                // cyan channel

/* ---------- math ---------- */
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const oExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const iExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const oCub=x=>1-Math.pow(1-x,3);
const ioCub=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ioExpo=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const oBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const smooth=x=>x*x*(3-2*x);
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

/* ---------- timeline ---------- */
const HITS=[[2,1],[4,1],[6,.75],[9,1],[9.25,.45],[9.5,.45],[9.75,.45],[10,.6],[10.25,.45],[10.5,.45],[10.75,.45],[11,1],[12.4,.8],[13,1]];
const GLITCH=[[1.9,2.0],[3.9,4.0],[8.7,9.0],[10.92,11.0],[12.9,13.0]];
const SECTIONS=[[0,'01','SIGNAL'],[2,'02','CONTROL'],[4,'03','NETWORK'],[6,'04','SENSING'],[9,'05','DOMAINS'],[11,'06','PRECISION'],[13,'07','IDENTITY']];
const decay=(t,k)=>{let s=0;for(const[h,a]of HITS)if(t>=h)s+=a*Math.exp(-(t-h)*k);return s};
const glitchAmt=t=>{let g=0;for(const[a,b]of GLITCH)if(t>=a&&t<b)g=Math.max(g,P(t,a,b));return g};

/* ---------- text helpers ---------- */
function T(s,x,y,o={}){ctx.save();ctx.font=o.f||'500 16px JBM';ctx.fillStyle=o.c||COL.wh;ctx.textAlign=o.a||'left';
 ctx.textBaseline=o.b||'alphabetic';ctx.globalAlpha*=(o.al??1);ctx.letterSpacing=(o.ls||0)+'px';
 if(o.stroke){ctx.strokeStyle=o.c||COL.wh;ctx.lineWidth=o.stroke;ctx.strokeText(s,x,y)}else ctx.fillText(s,x,y);ctx.restore()}
const GLY='01ABCDEF#$%&*+<>/=';
function scr(str,p,t,seed=0){if(p<=0)return'';const n=str.length,k=Math.floor(p*n);let o='';
 for(let i=0;i<n;i++){const ch=str[i];if(i<k||ch===' ')o+=ch;else if(i<k+7)o+=GLY[Math.floor(hash(i*7.3+seed+Math.floor(t*40))*GLY.length)];else break}return o}
function slit(x,y,w,h,p,fn){if(p<=0)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.translate(0,(1-p)*h*1.05);fn();ctx.restore()}
function line(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke()}

/* ---------- precomputed textures ---------- */
const DOT=mk(W+40,H);{const d=DOT.getContext('2d');d.fillStyle='rgba(120,180,255,0.16)';for(let x=0;x<W+40;x+=40)for(let y=20;y<H;y+=40)d.fillRect(x,y,2,2)}
const VIG=mk(W,H);{const v=VIG.getContext('2d');const g=v.createRadialGradient(CX,CY,300,CX,CY,1150);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.72)');v.fillStyle=g;v.fillRect(0,0,W,H)}
const NOISE=[];for(let k=0;k<6;k++){const c=mk(256,256),n=c.getContext('2d'),id=n.createImageData(256,256),r=rng(99+k);
 for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}n.putImageData(id,0,0);NOISE.push(c)}
const SCAN=mk(4,4);{const s=SCAN.getContext('2d');s.fillStyle='rgba(0,0,0,0.22)';s.fillRect(0,0,4,1)}

function bg(t,a=1){ctx.fillStyle=COL.bg;ctx.fillRect(-200,-200,W+400,H+400);
 const g=ctx.createRadialGradient(CX,CY,0,CX,CY,1100);g.addColorStop(0,'rgba(18,48,92,0.42)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.55*a;ctx.drawImage(DOT,-((t*24)%40),0);ctx.globalAlpha=1}

/* ============================================================
   SCENE 1 — SIGNAL (0–2s)
   ============================================================ */
function wave(x,t){const m=smooth(clamp((x-350)/(W-800)));
 const an=Math.sin(x*.017+t*2)*58*Math.sin(x*.0037+1.2)+Math.sin(x*.071+t*6)*9;
 const per=112,ph=(x%per)/per,duty=.25+.5*(.5+.5*Math.sin(x*.0061));
 return CY+lerp(an,ph<duty?-72:72,m)}
function s1(t){
 bg(t,P(t,0,.5));
 const out_=P(t,1.78,1.9), fade=1-out_;
 // oscilloscope graticule
 const ga=.16*oCub(P(t,.05,.6))*fade, gx0=160,gx1=W-160,gy0=CY-300,gy1=CY+300;
 ctx.strokeStyle=cyA(ga);ctx.lineWidth=1;ctx.beginPath();
 for(let i=0;i<=12;i++){const x=lerp(gx0,gx1,i/12);ctx.moveTo(x,gy0);ctx.lineTo(x,gy1)}
 for(let j=0;j<=6;j++){const y=lerp(gy0,gy1,j/6);ctx.moveTo(gx0,y);ctx.lineTo(gx1,y)}
 for(let i=0;i<=60;i++){const x=lerp(gx0,gx1,i/60);ctx.moveTo(x,CY-6);ctx.lineTo(x,CY+6)}ctx.stroke();
 const la=ga/.16;
 T('CH1  2.00 V/div    500 µs/div    TRIG ↑ 1.20 V',gx0,gy0-18,{c:COL.cy,al:.85*la,f:'500 15px JBM',ls:1});
 T('ACQ 1.00 GS/s  ● RUN',gx1,gy0-18,{a:'right',c:COL.or,al:.9*la,f:'500 15px JBM',ls:1});
 T(scr('ECU_PWR  OK   CLK  LOCK   BOOT  0x0000_8000',P(t,.3,1),t,3),gx0,gy1+34,{c:COL.cy,al:.7*la,f:'500 14px JBM',ls:2});
 // big word (behind trace)
 const wp=oExpo(P(t,.55,1.05));
 ctx.save();ctx.globalAlpha=fade;
 slit(0,CY-360,W,250,wp,()=>T('SIGNAL',CX,CY-128,{a:'center',f:'800 210px Unb',ls:lerp(60,8,wp),c:COL.wh}));
 slit(0,CY+140,W,90,oExpo(P(t,.95,1.35)),()=>T('すべては、ひとつの信号から。',CX,CY+208,{a:'center',f:'900 44px NJP',ls:6,c:COL.wh,al:.92}));
 T(scr('// 01 — SIGNAL ACQUISITION',P(t,.45,.8),t,1),CX,CY-380,{a:'center',c:COL.cy,f:'500 16px JBM',ls:5});
 ctx.restore();
 // trace
 const p=P(t,.18,1.62),hx=lerp(-40,W+40,.35*smooth(p)+.65*p),x0=Math.max(-40,hx-1500);
 if(t>.18&&fade>0){
  const g=ctx.createLinearGradient(x0,0,hx,0);g.addColorStop(0,cyA(0));g.addColorStop(.7,cyA(.7));g.addColorStop(1,'rgba(220,255,255,1)');
  ctx.strokeStyle=g;ctx.lineWidth=3.2;ctx.lineJoin='round';ctx.globalAlpha=fade;ctx.beginPath();
  for(let x=x0;x<=hx;x+=2){const y=wave(x,t);x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  const hy=wave(hx,t);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,7,0,TAU);ctx.fill();
  const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,90);hg.addColorStop(0,cyA(.55));hg.addColorStop(1,cyA(0));ctx.fillStyle=hg;ctx.fillRect(hx-90,hy-90,180,180);
  // beat rings on the head
  for(const b of[.5,1,1.5]){if(t>=b&&t<b+.35){const q=P(t,b,b+.35);ctx.strokeStyle=whA(1-q);ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,10+q*110,0,TAU);ctx.stroke()}}
  ctx.globalAlpha=1;
 }
 // flatline → collapse to a point (transition into chip)
 if(t>=1.76){const q=P(t,1.76,1.99),hw=(W/2+40)*(1-iExpo(q))*oExpo(P(t,1.76,1.8));
  ctx.fillStyle='#fff';ctx.fillRect(CX-hw,CY-2,hw*2,4);
  const hg=ctx.createRadialGradient(CX,CY,0,CX,CY,160);hg.addColorStop(0,whA(.8*q));hg.addColorStop(1,cyA(0));ctx.fillStyle=hg;ctx.fillRect(CX-160,CY-160,320,320)}
}

/* ============================================================
   SCENE 2 — CONTROL / ECU (2–4s)
   ============================================================ */
const CHIP=250,PINS=14;
const TR=(function(){const r=rng(7),out=[];const sides=[[1,0],[0,1],[-1,0],[0,-1]];
 for(let s=0;s<4;s++){const[dx,dy]=sides[s];for(let i=0;i<PINS;i++){const off=(i-(PINS-1)/2)*16;
  let x=dx?dx*(CHIP/2+16):off,y=dy?dy*(CHIP/2+16):off;const pts=[[x,y]],cum=[0];
  const sg=off>=0?1:-1,px=-dy*sg,py=dx*sg;let len=0,diag=false;const total=500+r()*1300;
  let seg=10+r()*50;
  while(len<total){const vx=diag?dx+px:dx,vy=diag?dy+py:dy,l=Math.hypot(vx,vy);
   x+=vx*seg;y+=vy*seg;len+=seg*l;pts.push([x,y]);cum.push(len);
   diag=!diag&&r()<.55+Math.abs(off)/300;seg=diag?20+r()*70:40+r()*170}
  out.push({pts,cum,total:len,orange:r()<.14,d:r()*.28,sp:600+r()*700})}}return out})();
function polyRange(pts,cum,L0,L1){ctx.beginPath();let started=false;
 for(let i=1;i<pts.length;i++){const a=cum[i-1],b=cum[i];if(b<L0)continue;if(a>L1)break;
  const t0=clamp((L0-a)/(b-a)),t1=clamp((L1-a)/(b-a)),A=pts[i-1],B=pts[i];
  const x0=lerp(A[0],B[0],t0),y0=lerp(A[1],B[1],t0),x1=lerp(A[0],B[0],t1),y1=lerp(A[1],B[1],t1);
  if(!started){ctx.moveTo(x0,y0);started=true}ctx.lineTo(x1,y1)}ctx.stroke()}
function ptAt(pts,cum,L){for(let i=1;i<pts.length;i++)if(cum[i]>=L){const q=(L-cum[i-1])/(cum[i]-cum[i-1]);return[lerp(pts[i-1][0],pts[i][0],q),lerp(pts[i-1][1],pts[i][1],q)]}return pts[pts.length-1]}
function s2(t){const u=t-2;bg(t);
 const punch=iExpo(P(u,1.7,2.0)),z=lerp(.88,1.22,ioCub(P(u,0,1.8)))*(1+7*punch);
 ctx.save();ctx.translate(CX,CY);ctx.scale(z,z);ctx.rotate(lerp(.05,-.03,ioCub(P(u,0,2))));
 // shockwave
 if(u<.8){const q=oExpo(P(u,0,.8));ctx.strokeStyle=whA(.7*(1-q));ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,40+q*1100,0,TAU);ctx.stroke()}
 // traces
 ctx.lineCap='round';
 for(let k=0;k<TR.length;k++){const tr=TR[k],L=(tr.total+10)*oExpo(P(u,.04+tr.d,1.25+tr.d));if(L<=0)continue;
  ctx.strokeStyle=tr.orange?orA(.75):cyA(.5);ctx.lineWidth=2.2;polyRange(tr.pts,tr.cum,0,L);
  if(L>=tr.total){const e=tr.pts[tr.pts.length-1];ctx.lineWidth=2;ctx.beginPath();ctx.arc(e[0],e[1],6,0,TAU);ctx.stroke()}
  // data packets
  ctx.strokeStyle=tr.orange?'#ffd2b0':'#e6ffff';ctx.lineWidth=3.2;
  for(let j=0;j<2;j++){const pos=((u*tr.sp+k*137+j*(tr.total/2))%(tr.total+200))-100;if(pos>10&&pos<L)polyRange(tr.pts,tr.cum,Math.max(0,pos-55),pos)}}
 // chip
 const cs=oBack(P(u,0,.45)),ca=(1-oExpo(P(u,0,.6)))*(-Math.PI/2);
 ctx.save();ctx.rotate(ca);ctx.scale(cs,cs);const h=CHIP/2;
 ctx.fillStyle='#061019';ctx.fillRect(-h,-h,CHIP,CHIP);ctx.strokeStyle=COL.cy;ctx.lineWidth=2;ctx.strokeRect(-h,-h,CHIP,CHIP);
 ctx.fillStyle=cyA(.9);for(let s=0;s<4;s++){ctx.save();ctx.rotate(s*Math.PI/2);for(let i=0;i<PINS;i++)ctx.fillRect(h,(i-(PINS-1)/2)*16-3,16,6);ctx.restore()}
 ctx.strokeStyle=cyA(.22);ctx.lineWidth=1;ctx.beginPath();for(let i=-5;i<=5;i++){ctx.moveTo(i*14,-70);ctx.lineTo(i*14,70);ctx.moveTo(-70,i*14);ctx.lineTo(70,i*14)}ctx.stroke();
 ctx.strokeStyle=cyA(.8);ctx.strokeRect(-78,-78,156,156);
 ctx.save();ctx.rotate(u*1.4);ctx.strokeStyle=orA(.9);ctx.lineWidth=2;ctx.strokeRect(-46,-46,92,92);ctx.restore();
 ctx.fillStyle=COL.or;ctx.beginPath();ctx.arc(-h+18,-h+18,5,0,TAU);ctx.fill();
 T('ECU',0,14,{a:'center',f:'800 46px Unb',c:COL.wh});
 T('MCU · 32BIT · LOCKSTEP',0,h-18,{a:'center',f:'500 12px JBM',c:COL.cy,ls:1.5});
 ctx.restore();ctx.restore();
 // HUD-space typography
 const fa=1-P(u,1.7,1.85);ctx.save();ctx.globalAlpha=fa;
 T(scr('02 / CONTROL',P(u,.15,.45),t,11),120,795,{c:COL.cy,f:'700 16px JBM',ls:5});
 slit(110,812,1100,90,oExpo(P(u,.22,.62)),()=>T('ELECTRONIC',120,888,{f:'800 76px Unb',ls:2}));
 slit(110,898,1100,90,oExpo(P(u,.32,.72)),()=>T('CONTROL UNIT',120,974,{f:'800 76px Unb',ls:2,c:COL.cy}));
 const log=['TASK_1MS ......... OK','TASK_10MS ........ OK','CAN_RX 0x1A4 ..... 8B','ADC_CH07 ......... 2.481 V','INJ_TIMING ....... -12.5°CA','WDG .............. FEED'];
 for(let i=0;i<log.length;i++){const q=P(u,.45+i*.1,.62+i*.1);if(q>0)T(scr(log[i],q,t,i*5),W-560,200+i*30,{c:i===4?COL.or:COL.cy,al:.85,f:'500 17px JBM',ls:1})}
 ctx.restore();
}

/* ============================================================
   SCENE 3 — NETWORK (4–6s)
   ============================================================ */
function bitSeq(seed,n){const r=rng(seed),a=[];let v=0;for(let i=0;i<n;i++){if(r()<.42)v=1-v;a.push(v)}return a}
function pamSeq(seed,n){const r=rng(seed),a=[];for(let i=0;i<n;i++)a.push(Math.floor(r()*3)-1);return a}
const LANES=[
 {y:385,name:'CAN FD',rate:'2 Mbit/s DATA PHASE',type:'diff',bw:22,sp:950,amp:30,bits:bitSeq(11,600),
  fields:[['SOF',1],['ID 0x1A4',11],['FDF',3],['DLC 8',4],['DATA  3F A1 00 7C E2 19 04 B8',64],['CRC 0x5D2E',17],['ACK',2],['EOF',7]]},
 {y:610,name:'LIN',rate:'19.2 kbit/s',type:'single',bw:34,sp:560,amp:26,bits:bitSeq(23,400),
  fields:[['BREAK',13],['SYNC 0x55',10],['PID 0x3C',10],['DATA 12 FF 08 00',40],['CHK 0xA2',10],['',6]]},
 {y:835,name:'100BASE-T1',rate:'100 Mbit/s · PAM3',type:'pam',bw:12,sp:1500,amp:28,bits:pamSeq(5,900),
  fields:[['PREAMBLE',56],['DST 02:1A:4F:..',48],['SRC 02:1A:07:..',48],['VLAN 0x8100',32],['SOME/IP  0x4711',64],['PAYLOAD',140],['FCS',32]]}];
LANES.forEach(l=>{l.fb=l.fields.reduce((s,f)=>s+f[1],0)});
const HEXCOL=(function(){const r=rng(3),cols=[];for(let c=0;c<44;c++){const a=[];for(let i=0;i<48;i++){const id=Math.floor(r()*0x7ff).toString(16).toUpperCase().padStart(3,'0');a.push(r()<.5?id:(Math.floor(r()*255).toString(16).toUpperCase().padStart(2,'0')))}cols.push({a,sp:60+r()*220,o:r()*1000})}return cols})();
function laneVal(l,x,u){const s=x+u*l.sp,i=Math.floor(s/l.bw),fr=(s/l.bw)-i,n=l.bits.length;
 const b=l.bits[((i%n)+n)%n],pb=l.bits[(((i-1)%n)+n)%n];return fr<.14?lerp(pb,b,fr/.14):b}
function s3(t){const u=t-4;bg(t);
 // hex rain
 ctx.font='500 14px JBM';ctx.fillStyle=cyA(.09);ctx.textAlign='left';
 for(let c=0;c<HEXCOL.length;c++){const col=HEXCOL[c],x=20+c*44;for(let r=0;r<40;r++){const y=((r*28+col.o+u*col.sp)%(40*28))-28;ctx.fillText(col.a[(r+c)%48],x,y)}}
 T('NETWORK',lerp(260,-120,u/2),CY+120,{f:'800 330px Unb',stroke:1.5,c:COL.cy,al:.13});
 // squash transition
 const sq=1-ioExpo(P(u,1.55,1.93));
 ctx.save();ctx.translate(0,CY);ctx.scale(1,Math.max(sq,.004));ctx.translate(0,-CY);
 LANES.forEach((l,li)=>{const d=li*.1,rv=W*oExpo(P(u,d,d+.55));if(rv<=0)return;
  ctx.save();ctx.beginPath();ctx.rect(0,l.y-150,rv,260);ctx.clip();
  // baseline
  ctx.strokeStyle=whA(.12);ctx.lineWidth=1;line(0,l.y,W,l.y);
  // frame boxes
  const fw=l.fb*l.bw,off=(u*l.sp)%fw;ctx.font='500 13px JBM';
  for(let f=-1;f<=Math.ceil(W/fw)+1;f++){let bx=f*fw-off;
   for(const[lab,nb]of l.fields){const w=nb*l.bw;if(bx+w>0&&bx<W&&lab){ctx.strokeStyle=cyA(.35);ctx.strokeRect(bx+2,l.y-100,w-4,30);
    if(w>60){ctx.fillStyle=lab.startsWith('DATA')||lab.startsWith('SOME')?COL.or:whA(.85);ctx.fillText(lab,bx+10,l.y-80)}}bx+=w}}
  // waveform
  ctx.lineWidth=2.6;ctx.lineJoin='round';
  if(l.type==='diff'){for(const[sgn,col]of[[-1,COL.or],[1,COL.cy]]){ctx.strokeStyle=col;ctx.beginPath();
    for(let x=0;x<=rv;x+=3){const v=laneVal(l,x,u),y=l.y+sgn*(4+v*l.amp);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}
  else if(l.type==='single'){ctx.strokeStyle=COL.wh;ctx.beginPath();for(let x=0;x<=rv;x+=3){const v=laneVal(l,x,u),y=l.y-l.amp+v*l.amp*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
  else{ctx.strokeStyle=COL.cy;ctx.beginPath();for(let x=0;x<=rv;x+=2){const v=laneVal(l,x,u),y=l.y-v*l.amp;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
  // lane label
  ctx.fillStyle='rgba(3,6,12,0.85)';ctx.fillRect(100,l.y+34,560,40);

  ctx.strokeStyle=red?(lit?COL.rd:'rgba(255,45,85,.5)'):lit?COL.wh:whA(.3);ctx.lineWidth=maj?4:2;const r0=maj?350:368;
  line(Math.cos(a)*r0,Math.sin(a)*r0,Math.cos(a)*395,Math.sin(a)*395);
  if(maj){T(String(k/15|0),Math.cos(a)*315,Math.sin(a)*315+9,{a:'center',f:'700 24px JBM',c:red?COL.rd:COL.wh,al:.9})}}
 // value arc
 if(v>0){const g=ctx.createConicGradient(A0,0,0);g.addColorStop(0,cyA(.2));g.addColorStop(.6,COL.cy);g.addColorStop(.72,COL.or);g.addColorStop(.75,COL.rd);g.addColorStop(1,COL.rd);
  ctx.strokeStyle=g;ctx.lineWidth=18;ctx.beginPath();ctx.arc(0,0,420,A0,av);ctx.stroke()}
 // needle
 ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';line(Math.cos(av)*-40,Math.sin(av)*-40,Math.cos(av)*380,Math.sin(av)*380);
 ctx.fillStyle=COL.or;ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();
 // readout
 const rpm=Math.round(v*8000/10)*10;
 T('ENGINE CONTROL',0,-92,{a:'center',f:'700 17px JBM',c:COL.cy,ls:6});
 T(rpm.toLocaleString('en-US'),0,50,{a:'center',f:'800 118px Unb',c:v>.8?COL.rd:COL.wh,ls:2});
 T('r/min',0,100,{a:'center',f:'500 20px JBM',c:whA(.8),ls:4});
 ctx.restore();
 // side readouts
 const fa=1-P(u,1.62,1.8);ctx.save();ctx.globalAlpha=fa;
 const RD=[[200,250,'LAMBDA',`λ ${(1+.004*Math.sin(u*13)).toFixed(3)}`,COL.wh],[200,780,'EGT',`${Math.round(lerp(380,612,v))} °C`,COL.or],
  [W-200,250,'NOx · SCR OUT',`${Math.round(lerp(64,18,v))} ppm`,COL.cy],[W-200,780,'OBD MONITORS','READY ✓',COL.cy]];
 RD.forEach((r,i)=>{const q=oExpo(P(u,.35+i*.1,.75+i*.1));if(q<=0)return;const al=i<2?'left':'right';
  ctx.strokeStyle=whA(.4*q);ctx.lineWidth=1;line(r[0],r[1]+18,r[0]+(i<2?1:-1)*300*q,r[1]+18);
  T(scr(r[2],q,t,i*3),r[0],r[1]-44,{a:al,f:'700 15px JBM',c:COL.cy,ls:4});
  slit(i<2?r[0]-10:r[0]-420,r[1]-40,430,58,q,()=>T(r[3],r[0],r[1]+4,{a:al,f:'800 44px Unb',c:r[4]}))});
 // standards ticker
 const tick='ISO 26262 ASIL-D   ///   ISO/SAE 21434   ///   AUTOMOTIVE SPICE   ///   UN R155 / R156   ///   EURO 7   ///   OBD / OBM   ///   AUTOSAR   ///   ';
 ctx.font='700 18px JBM';ctx.letterSpacing='4px';const tw=ctx.measureText(tick).width;ctx.fillStyle=whA(.7*oExpo(P(u,.2,.6)));ctx.textAlign='left';
 for(let k=-1;k<3;k++)ctx.fillText(tick,k*tw-((u*260)%tw),H-128);ctx.letterSpacing='0px';
 ctx.strokeStyle=whA(.15);line(0,H-160,W,H-160);line(0,H-112,W,H-112);
 slit(0,90,W,70,oExpo(P(u,.15,.5)),()=>T('PRECISION IN EVERY MILLISECOND',CX,145,{a:'center',f:'800 40px Unb',ls:6}));
 ctx.restore();
 // redline flash ring
 if(u>=1.4&&u<1.8){const q=P(u,1.4,1.8);ctx.strokeStyle=`rgba(255,45,85,${1-q})`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(CX,CY+10,420+q*500,0,TAU);ctx.stroke()}
}

/* ============================================================
   SCENE 7 — IDENTITY (13–15s)
   ============================================================ */
const GY=470,SCL=232;
const SIDE=(function(){const pts=[];const add=(x,y)=>pts.push([CX+x*SCL,GY-y*SCL]);
 add(-2.3,.3);add(-2.33,.55);for(let x=-2.3;x<=2.32;x+=.04)add(x,topY(x));add(2.32,.6);add(2.3,.3);add(1.84,.3);
 for(let i=0;i<=24;i++){const a=i/24*Math.PI;add(1.42+Math.cos(a)*.42,.36+Math.sin(a)*.42)}add(.99,.3);add(-.99,.3);
 for(let i=0;i<=24;i++){const a=i/24*Math.PI;add(-1.42+Math.cos(a)*.42,.36+Math.sin(a)*.42)}add(-1.84,.3);add(-2.3,.3);
 const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,L:cum[cum.length-1]}})();
const WIN=[[-1.38,1.0],[-.97,1.29],[-.32,1.38],[.34,1.35],[.86,1.06],[-1.38,1.0]].map(([x,y])=>[CX+x*SCL,GY-y*SCL]);
function s7(t){const u=t-13;bg(t,.5);
 // ground line burst
 const gl=(W/2)*oExpo(P(u,0,.3));const g=ctx.createLinearGradient(CX-gl,0,CX+gl,0);g.addColorStop(0,cyA(0));g.addColorStop(.5,whA(.9));g.addColorStop(1,cyA(0));
 ctx.fillStyle=g;ctx.fillRect(CX-gl,GY+4,gl*2,2);
 // silhouette + reflection
 const L=SIDE.L*ioCub(P(u,.08,.95));
 for(const refl of[1,0]){ctx.save();if(refl){ctx.beginPath();ctx.rect(0,GY+6,W,110);ctx.clip();ctx.translate(0,2*(GY+5));ctx.scale(1,-1);ctx.globalAlpha=.1}
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=COL.cy;ctx.lineWidth=3;polyRange(SIDE.pts,SIDE.cum,0,L);
  const wq=oCub(P(u,.55,.95));if(wq>0){ctx.strokeStyle=whA(.9);ctx.lineWidth=2.5;for(const wx of[-1.42,1.42]){ctx.beginPath();ctx.arc(CX+wx*SCL,GY-.36*SCL,.34*SCL,-Math.PI/2,-Math.PI/2+TAU*wq);ctx.stroke();
    ctx.lineWidth=1.5;ctx.strokeStyle=cyA(.6);ctx.beginPath();ctx.arc(CX+wx*SCL,GY-.36*SCL,.2*SCL,0,TAU*wq);ctx.stroke();ctx.strokeStyle=whA(.9);ctx.lineWidth=2.5}}
  const wn=P(u,.5,.9);if(wn>0){ctx.strokeStyle=cyA(.5);ctx.lineWidth=1.5;const c=[0];for(let i=1;i<WIN.length;i++)c.push(c[i-1]+Math.hypot(WIN[i][0]-WIN[i-1][0],WIN[i][1]-WIN[i-1][1]));polyRange(WIN,c,0,c[c.length-1]*oCub(wn))}
  ctx.restore()}
 if(L>0&&L<SIDE.L){const p=ptAt(SIDE.pts,SIDE.cum,L);const hg=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],60);hg.addColorStop(0,whA(1));hg.addColorStop(1,cyA(0));ctx.fillStyle=hg;ctx.fillRect(p[0]-60,p[1]-60,120,120)}
 // lights + anamorphic streaks
 const lq=oExpo(P(u,.9,1.2));if(lq>0){const hx=CX+2.25*SCL,hy=GY-.74*SCL;const sg=ctx.createLinearGradient(hx-700,0,hx+700,0);sg.addColorStop(0,cyA(0));sg.addColorStop(.5,whA(.95));sg.addColorStop(1,cyA(0));
  ctx.fillStyle=sg;ctx.globalAlpha=lq;ctx.fillRect(hx-700*lq,hy-1.5,1400*lq,3);const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,70);hg.addColorStop(0,whA(1));hg.addColorStop(1,cyA(0));ctx.fillStyle=hg;ctx.fillRect(hx-70,hy-70,140,140);
  const tx=CX-2.28*SCL,ty=GY-.8*SCL,rg=ctx.createRadialGradient(tx,ty,0,tx,ty,50);rg.addColorStop(0,'rgba(255,60,80,1)');rg.addColorStop(1,'rgba(255,45,85,0)');ctx.fillStyle=rg;ctx.fillRect(tx-50,ty-50,100,100);
  ctx.fillStyle='rgba(255,45,85,.8)';ctx.fillRect(tx-240*lq,ty-1,480*lq,2);ctx.globalAlpha=1}
 // tagline, per-character
 const tag='クルマの神経系を、設計する。';ctx.font='900 78px NJP';ctx.letterSpacing='10px';const tw=ctx.measureText(tag).width;let x=CX-tw/2;
 for(let i=0;i<tag.length;i++){const ch=tag[i],cw=ctx.measureText(ch).width,q=oExpo(P(u,.62+i*.03,1.0+i*.03));
  if(q>0){ctx.save();ctx.beginPath();ctx.rect(x-5,570,cw+20,110);ctx.clip();T(ch,x,660+(1-q)*90,{f:'900 78px NJP',c:(ch==='神'||ch==='経'||ch==='系')?COL.cy:COL.wh,ls:10});ctx.restore()}x+=cw}
 const eq=oExpo(P(u,.95,1.6));
 T('AUTOMOTIVE ELECTRONICS ENGINEERING',CX,738,{a:'center',f:'800 30px IT',ls:lerp(30,12,eq),al:eq});
 ctx.strokeStyle=whA(.4*eq);ctx.lineWidth=1;line(CX-760,727,CX-760+170*eq,727);line(CX+760,727,CX+760-170*eq,727);
 T(scr('E/E ARCHITECTURE  ·  CONTROL  ·  DIAGNOSTICS  ·  VALIDATION  ·  HOMOLOGATION',P(u,.95,1.3),t,51),CX,790,{a:'center',f:'500 16px JBM',c:COL.cy,ls:4,al:.85});
 // drifting particles
 const r=rng(9);for(let k=0;k<70;k++){const px=r()*W,py=(r()*H-u*(20+r()*60))%H,s=r()*2+1;ctx.fillStyle=cyA(.25*r()*P(u,.2,.8));ctx.fillRect(px,(py+H)%H,s,s)}
}

/* ============================================================
   HUD + POST
   ============================================================ */
function hud(t){const a=oCub(P(t,.05,.5))*(1-P(t,13.1,13.5));if(a<=0)return;const o=octx;o.save();o.globalAlpha=a;o.globalCompositeOperation='difference';
 o.strokeStyle='rgba(255,255,255,.6)';o.fillStyle='rgba(255,255,255,.72)';o.lineWidth=2;const m=44,L=44*a;
 for(const[x,y,sx,sy]of[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){o.beginPath();o.moveTo(x+sx*L,y);o.lineTo(x,y);o.lineTo(x,y+sy*L);o.stroke()}
 o.font='500 13px JBM';o.letterSpacing='3px';o.textAlign='left';o.fillText('E/E ENGINEERING — SHOWREEL 2026',m+60,m+5);
 const fr=Math.round(t*FPS),ss=Math.floor(fr/FPS),ff=fr%FPS;o.textAlign='right';o.fillText(`TC 00:00:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`,W-m-60,m+5);
 let sec=SECTIONS[0];for(const s of SECTIONS)if(t>=s[0])sec=s;o.textAlign='left';o.fillText(`${sec[1]}  ${sec[2]}`,m+60,H-m+5);
 o.textAlign='right';o.fillText(`FRAME ${String(fr).padStart(4,'0')} / ${DUR*FPS}`,W-m-60,H-m+5);
 o.fillRect(m+60,H-m-18,(W-2*m-120)*t/DUR,2);o.globalCompositeOperation='source-over';
 if(Math.floor(t*2)%2===0){o.fillStyle=COL.rd;o.beginPath();o.arc(W-m-35,m,6,0,TAU);o.fill()}
 o.restore();o.letterSpacing='0px'}
function post(t){const f=Math.round(t*FPS),beat=t>=2&&t<13?Math.exp(-((t%.5))*9):0;
 b1.clearRect(0,0,W/4,H/4);b1.filter='blur(5px)';b1.drawImage(S,0,0,W/4,H/4);b1.filter='none';
 b2.clearRect(0,0,W/8,H/8);b2.filter='blur(9px)';b2.drawImage(S,0,0,W/8,H/8);b2.filter='none';
 const g=glitchAmt(t),ab=1.3+decay(t,8)*14+g*22;
 // RGB split
 rx.globalCompositeOperation='source-over';rx.drawImage(S,0,0);rx.globalCompositeOperation='multiply';rx.fillStyle='#ff0000';rx.fillRect(0,0,W,H);
 gx.globalCompositeOperation='source-over';gx.drawImage(S,0,0);gx.globalCompositeOperation='multiply';gx.fillStyle='#00ffff';gx.fillRect(0,0,W,H);
 const o=octx;o.globalCompositeOperation='source-over';o.globalAlpha=1;o.fillStyle='#000';o.fillRect(0,0,W,H);
 o.globalCompositeOperation='lighter';o.drawImage(R,-ab,0);o.drawImage(G,ab,0);
 // bloom
 o.imageSmoothingEnabled=true;o.globalAlpha=.62+beat*.25;o.drawImage(B1,0,0,W,H);o.globalAlpha=.5+beat*.2;o.drawImage(B2,0,0,W,H);o.globalAlpha=1;
 o.globalCompositeOperation='source-over';
 // glitch slices
 if(g>0){rx.globalCompositeOperation='source-over';rx.drawImage(out,0,0);const r=rng(f*31+7),n=4+Math.floor(g*16);
  for(let k=0;k<n;k++){const y=r()*H,h=4+r()*70*g,dx=(r()-.5)*260*g;o.drawImage(R,0,y,W,h,dx,y,W,h);if(r()<.3){o.fillStyle=r()<.5?cyA(.35*g):orA(.35*g);o.fillRect(0,y,W,h*.3)}}}
 // grade: vignette, scanlines, grain
 o.drawImage(VIG,0,0);o.globalAlpha=.35;o.fillStyle=o.createPattern(SCAN,'repeat');o.fillRect(0,0,W,H);
 o.globalAlpha=.055;o.globalCompositeOperation='overlay';const nz=NOISE[f%6];o.fillStyle=o.createPattern(nz,'repeat');o.save();o.translate((f*53)%256,(f*97)%256);o.fillRect(-256,-256,W+512,H+512);o.restore();
 o.globalCompositeOperation='source-over';o.globalAlpha=1;
 // flash
 const fl=Math.min(1,decay(t,16));if(fl>.01){o.globalCompositeOperation='lighter';o.fillStyle=`rgba(255,255,255,${.55*fl})`;o.fillRect(0,0,W,H);o.globalCompositeOperation='source-over'}
 hud(t);
 // fade to black
 const fb=P(t,14.62,14.98);if(fb>0){o.fillStyle=`rgba(0,0,0,${fb})`;o.fillRect(0,0,W,H)}
}

/* ============================================================
   FRAME
   ============================================================ */
function renderFrame(t){t=clamp(t,0,DUR-1e-6);
 const sh=decay(t,9)*16,sx=Math.sin(t*93.1)*sh,sy=Math.cos(t*71.7)*sh,z=1+decay(t,10)*.035;
 ctx.setTransform(z,0,0,z,CX-CX*z+sx,CY-CY*z+sy);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.setLineDash([]);ctx.lineCap='butt';
 if(t<2)s1(t);else if(t<4)s2(t);else if(t<6)s3(t);else if(t<9)s4(t);else if(t<11)s5(t);else if(t<13)s6(t);else s7(t);
 ctx.setTransform(1,0,0,1,0,0);post(t)}
window.renderFrame=renderFrame;

/* ---------- boot ---------- */
const RENDER=new URLSearchParams(location.search).has('render');
Promise.all(['800 40px Unb','500 16px JBM','700 16px JBM','900 40px NJP','800 30px IT'].map(f=>document.fonts.load(f,'Aあ神'))).then(()=>{
 window.READY=true;
 if(RENDER){document.getElementById('hint').remove();return}
 const audio=new Audio('soundtrack.wav');let playing=false,t0=performance.now();
 out.addEventListener('click',()=>{if(playing){audio.pause();playing=false}else{audio.currentTime=0;audio.play().catch(()=>{});playing=true;t0=performance.now()}});
 (function loop(){const t=playing&&!audio.paused?audio.currentTime:((performance.now()-t0)/1000)%DUR;renderFrame(t%DUR);if(playing&&audio.ended)playing=false;requestAnimationFrame(loop)})();
});
